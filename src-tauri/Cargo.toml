[package]
name = "git-agent-desktop"
version = "2.2.1"
description = "Automatizacion agentica de Pull Requests sobre GitHub CLI y GitHub Models"
authors = ["Git Agent Desktop"]
edition = "2021"
rust-version = "1.77"
default-run = "git-agent-desktop"

[lib]
name = "git_agent_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# En produccion el frontend se embebe en el binario y se sirve por el
# protocolo interno de Tauri. Sin esta feature, Tauri compila en modo
# desarrollo y la ventana intenta cargar `devUrl` (http://localhost:1420).
# `tauri build` la activa automaticamente; con `cargo build --release` hay que
# pasarla de forma explicita (`--features custom-protocol`).
default = []
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset", "http2", "gzip"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
similar = "2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[profile.dev]
incremental = true
